services:
  baby-panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: baby-panel:latest
    container_name: baby-panel
    restart: unless-stopped
    ports:
      - "${PORT:-3088}:${PORT:-3088}"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/app.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PORT=${PORT:-3088}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-stealth/ox-alpha}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - PUSH_SEND_TOKEN=${PUSH_SEND_TOKEN}

    volumes:
      - baby-data:/app/data

volumes:
  baby-data:
    driver: local
