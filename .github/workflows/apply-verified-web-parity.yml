name: Apply verified Web parity source
on:
  push:
    branches: [codex/go-web-complete-20260923]
    paths: [.github/workflows/apply-verified-web-parity.yml]
permissions:
  contents: write
jobs:
  apply-source:
    if: github.repository == 'WangZhuo2015/baby_panel_for_cecilia' && github.ref == 'refs/heads/codex/go-web-complete-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only checksum-verified reviewed source and publish normal commits
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/codex/go-web-complete-20260923 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -I -S - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          def git(*args, data=None):
              return subprocess.run(['git', *args], input=data, capture_output=True, check=True).stdout
          manifest = json.loads(pathlib.Path('.review/web-parity-manifest.json').read_text())
          raw = ''.join(pathlib.Path(f'.review/web-parity.patch.{i}.b64').read_text().strip() for i in range(6))
          patch = gzip.decompress(base64.b64decode(raw, validate=True))
          assert len(patch) < 200000
          assert hashlib.sha256(patch).hexdigest() == 'b2be845266969cb6f8cad3eb2382057820c334de1c12ed44a9961c9fbe8d8b9a' == manifest['patchSha256']
          files = manifest['files']
          assert len(files) == 20
          for name in files:
              path = pathlib.PurePosixPath(name)
              assert '..' not in path.parts and not path.is_absolute()
              assert path.parts[0] in ('app', 'components', 'lib', 'tests', 'types')
              assert not pathlib.Path(name).is_symlink()
          assert not git('status', '--porcelain').strip()
          git('apply', '--check', '-', data=patch)
          git('apply', '-', data=patch)
          for name, expected in files.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          git('diff', '--check')
          grouped = [name for group in manifest['groups'] for name in group['files']]
          assert sorted(grouped) == sorted(files)
          for group in manifest['groups']:
              git('add', '--', *group['files'])
              git('commit', '-m', group['message'])
          # Transient transport/export helpers are not part of the delivered tree.
          cleanup = [f'.review/web-parity.patch.{i}.b64' for i in range(6)] + [
              '.review/web-parity-manifest.json',
              '.github/workflows/apply-verified-web-parity.yml',
              '.github/workflows/go-web-workspace.yml',
              '.github/workflows/go-web-prisma-review.yml']
          git('rm', '--', *cleanup)
          git('commit', '-m', 'chore(review): remove source transport and dependency export workflows')
          assert not git('status', '--porcelain').strip()
          print('Verified 20 source after-images; created three implementation/test commits and removed temporary helpers.')
          PY
          git push origin HEAD:refs/heads/codex/go-web-complete-20260923
