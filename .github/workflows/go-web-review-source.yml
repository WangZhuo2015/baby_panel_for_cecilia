name: Go Web review source
on:
  pull_request:
    branches: [codex/web-parity-20260919]
    paths: ['.github/workflows/go-web-review-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/go-web-adapter-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Export committed source for isolated review
        run: |
          mkdir -p review-export
          git rev-parse HEAD > review-export/source-sha.txt
          git archive --format=tar HEAD > review-export/source.tar
          (cd review-export && sha256sum source.tar source-sha.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: go-web-review-${{ github.event.pull_request.head.sha }}
          path: review-export/*
          retention-days: 3
          if-no-files-found: error
