name: Boundary review source
on:
  pull_request:
    branches: [codex/web-parity-20260919]
    paths: [.github/workflows/boundary-review-source.yml]
permissions:
  contents: read
jobs:
  tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive only committed source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git archive --format=tar HEAD > "$RUNNER_TEMP/web-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-review-source-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/web-source.tar
            ${{ runner.temp }}/source-sha.txt
          if-no-files-found: error
          retention-days: 7
