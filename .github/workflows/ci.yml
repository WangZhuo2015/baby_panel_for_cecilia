name: CI

on:
  push:
    branches: [main, codex/migration-readiness-20260922]
  pull_request:
    branches: [main, codex/web-parity-20260919]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Lint (Oxlint)
        run: npm run lint
      - name: Validate Prisma Schema
        run: npx prisma validate
      - name: Check Database Migrations Baseline
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - name: Verify baseline migration applies to a fresh database
        run: |
          rm -f /tmp/ci-fresh.db*
          DATABASE_URL="file:/tmp/ci-fresh.db" npx prisma migrate deploy
          rm -f /tmp/ci-fresh.db*
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical
      - name: Verify version consistency (package.json = lib/version.ts = sw.js)
        run: |
          node -e "
            const fs=require('fs');
            const pkg=require('./package.json').version;
            const ui=fs.readFileSync('lib/version.ts','utf8').match(/APP_VERSION\s*=\s*\"v([\d.]+)\"/);
            const sw=fs.readFileSync('public/sw.js','utf8').match(/CACHE_VERSION\s*=\s*'v([\d.]+)'/);
            if(!ui||!sw){console.error('版本文件解析失败');process.exit(1);}
            if(pkg!==ui[1]||pkg!==sw[1]){console.error(\`版本漂移: pkg=\${pkg} ui=\${ui[1]} sw=\${sw[1]}\`);process.exit(1);}
            console.log('version consistent:', pkg);
          "
      - name: Run unit and AI tests
        run: npm test
      - name: Run Next.js build
        run: npm run build
      - name: Verify Docker build
        run: docker build --build-arg BUILD_REVISION="$(git rev-parse HEAD)" -t baby-panel:test .
