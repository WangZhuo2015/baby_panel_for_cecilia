name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Check migration drift (migrations vs schema)
        run: |
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script > /tmp/drift.sql
          # 空差异时 Prisma 仍会输出 "-- This is an empty migration." 注释，过滤后再判断
          if grep -qvE '^\s*(--|$)' /tmp/drift.sql; then
            echo "::error::prisma/migrations 与 schema.prisma 存在漂移，请生成增量迁移"
            cat /tmp/drift.sql
            exit 1
          fi

      - name: Verify baseline migration applies to a fresh database
        run: |
          rm -f /tmp/ci-fresh.db*
          DATABASE_URL="file:/tmp/ci-fresh.db" npx prisma migrate deploy
          rm -f /tmp/ci-fresh.db*

      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Run Next.js build
        run: npm run build

      - name: Verify version consistency (package.json = lib/version.ts = sw.js)
        run: |
          node -e "
            const fs=require('fs');
            const pkg=require('./package.json').version;
            const ui=fs.readFileSync('lib/version.ts','utf8').match(/APP_VERSION\s*=\s*\"v([\d.]+)\"/);
            const sw=fs.readFileSync('public/sw.js','utf8').match(/CACHE_VERSION\s*=\s*'v([\d.]+)'/);
            if(!ui||!sw){console.error('版本文件解析失败');process.exit(1);}
            if(pkg!==ui[1]||pkg!==sw[1]){console.error(\`版本漂移: pkg=\${pkg} ui=\${ui[1]} sw=\${sw[1]}\`);process.exit(1);}
            console.log('version consistent:', pkg);
          "
