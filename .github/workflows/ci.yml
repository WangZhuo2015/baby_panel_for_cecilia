name: CI

on:
  push:
    branches: [main, codex/web-parity-20260919]
  pull_request:
    branches: [main, codex/web-parity-20260919]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git diff --exit-code
          sha256sum Dockerfile package-lock.json scripts/prepare-standalone.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Check Database Migrations Baseline
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Verify baseline migration applies to a fresh database
        run: |
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          DATABASE_URL="file:$directory/ci-fresh.db" npx prisma migrate deploy

      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Verify version consistency (package.json = lib/version.ts = sw.js)
        run: |
          node -e "
            const fs=require('fs');
            const pkg=require('./package.json').version;
            const ui=fs.readFileSync('lib/version.ts','utf8').match(/APP_VERSION\s*=\s*\"v([\d.]+)\"/);
            const sw=fs.readFileSync('public/sw.js','utf8').match(/CACHE_VERSION\s*=\s*'v([\d.]+)'/);
            if(!ui||!sw){console.error('版本文件解析失败');process.exit(1);}
            if(pkg!==ui[1]||pkg!==sw[1]){console.error(\`版本漂移: pkg=\${pkg} ui=\${ui[1]} sw=\${sw[1]}\`);process.exit(1);}
            console.log('version consistent:', pkg);
          "

      - name: Run unit tests
        run: npm test

      - name: Run Next.js build
        run: npm run build

      - name: Verify GrowDesk Go adapter runtime wiring
        run: node scripts/review/check-growdesk-runtime.mjs

      - name: Verify Docker build and embedded revision
        run: |
          docker build --build-arg "BUILD_REVISION=$SOURCE_REVISION" -t baby-panel:test .
          docker run --rm --network none --entrypoint node \
            -e "EXPECTED_REVISION=$SOURCE_REVISION" baby-panel:test -e '
            const fs = require("node:fs");
            const assert = require("node:assert/strict");
            const build = JSON.parse(fs.readFileSync("build-provenance.json", "utf8"));
            assert.equal(build.sourceGitSha, process.env.EXPECTED_REVISION);
            assert.equal(build.sourceDirty, false);
            assert.match(build.artifactSha256, /^[0-9a-f]{64}$/);
            assert.ok(build.buildId);
            console.log(JSON.stringify(build));
          '
